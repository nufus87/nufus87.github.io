<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Personal Page Nufus</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
      }

      .hero {
        width: 100%;
        padding-top: 5rem;
        padding-bottom: 5rem;
      }

      .hero .greeting {
        margin-bottom: 7rem;
        font-size: 2rem;
        font-weight: 300;
      }

      .hero .intro {
        max-width: 680px;
        margin: 0;
        font-size: clamp(2rem, 3vw, 2.5rem);
        line-height: 1.4;
        font-weight: 300;
      }

      .hero .intro strong {
        color: var(--pico-primary);
      }

      .contact {
        margin-top: 7rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
      }

      .contact a {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        text-decoration: none;
      }

      footer {
        border-top: 1px solid var(--pico-muted-border-color);
      }

      .footer-inner {
        min-height: 110px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
      }

      .credit {
        margin: 0;
        font-size: 0.85rem;
        line-height: 1.6;
      }

      .credit a,
      .social a {
        text-decoration: none;
      }

      .social {
        display: flex;
        align-items: center;
        gap: 1.75rem;
      }

      .social a {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .social i {
        font-size: 1rem;
      }

      @media (max-width: 700px) {
        .hero {
          padding-top: 5rem;
          padding-bottom: 6rem;
        }

        .hero .greeting {
          margin-bottom: 4rem;
        }

        .contact {
          margin-top: 4rem;
        }

        .footer-inner {
          padding-top: 2rem;
          padding-bottom: 2rem;
          align-items: flex-start;
          flex-direction: column;
        }

        .social {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <section class="container hero">
        <p class="greeting">Hello! 👋</p>

        <p class="intro">
          I'm <strong>Nufus</strong>, a tourism student and enthusiast with an
          interest in destination marketing, management, and development 🌴
        </p>

        <div class="contact">
          <span>Let's connect on</span>

          <a
            href="https://www.linkedin.com/in/nufuszs/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="bi bi-linkedin"></i>
            LinkedIn
          </a>
        </div>
      </section>
    </main>

    <footer>
      <div class="container footer-inner">
        <div class="credit">
          <div>
            Made with ☕ by
            <a href="https://github.com/nufus87"> nfz </a>
          </div>

          <div>
            Inspired by
            <a
              href="https://bchiang7.github.io/"
              target="_blank"
              rel="noopener noreferrer"
            >
              Brittany Chiang
            </a>
          </div>
        </div>

        <nav class="social">
          <a
            href="https://www.instagram.com/nufuszs/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="bi bi-instagram"></i>
            Instagram
          </a>

          <a
            href="https://www.linkedin.com/in/nufuszs/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="bi bi-linkedin"></i>
            LinkedIn
          </a>

          <a
            href="https://t.me/nufuszs"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="bi bi-telegram"></i>
            Telegram
          </a>
        </nav>
      </div>
    </footer>
  </body>
</html>
